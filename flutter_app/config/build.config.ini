# ?? MEENGLE FLUTTER CONFIGURATION
# Complete production setup for Android, iOS, and Web

[app]
# App name
display_name=Meengle

# Package names
package_name=com.meengle.app
ios_bundle_id=com.meengle.app

# Version configuration
version=1.0.0+1
build_number=1

[android]
# Target SDK version
target_sdk_version=34
min_sdk_version=21
compile_sdk_version=34

# App signing configuration
release_keystore_path=android/app/upload-keystore.jks
release_keystore_password=YOUR_KEYSTORE_PASSWORD
release_key_alias=upload
release_key_password=YOUR_KEY_PASSWORD

# APK configuration
abi_filters=arm64-v8a
enable_multidex=true

# App bundle configuration for Google Play
aab_enabled=true
aab_path=build/app/outputs/bundle/release/app-release.aab

[ios]
# Target deployment version
minimum_deployment_target=12.0

# Bundle identifier
bundle_identifier=com.meengle.app

# Signing configuration
development_team=YOUR_TEAM_ID
provisioning_profile=Meengle_Release

# Build settings
build_for_device=true
build_number=1
version_number=1.0.0

[web]
# Web configuration
target=web
base_href=/

# Progressive Web App settings
pwa_enabled=true
service_worker_enabled=true

# Web server configuration
port=8080
hostname=localhost

[build]
# Build optimization
optimize_for_release=true
enable_obfuscation=true
split_debug_info=true

# Signing
sign_apk=true
enable_release_mode=true

# Features
enable_nullsafety=true
enable_null_assertion=false

[distribution]
# Google Play Store
google_play_console_url=https://play.google.com/console
google_play_package_name=com.meengle.app

# Apple App Store
app_store_connect_url=https://appstoreconnect.apple.com
ios_bundle_id=com.meengle.app

# Web hosting
web_hosting_url=https://meengle.app
firebase_hosting_enabled=true

[analytics]
# Analytics configuration
firebase_enabled=true
google_analytics_enabled=true
mixpanel_enabled=false

[crashlytics]
# Crash reporting
firebase_crashlytics_enabled=true
bugsnag_enabled=false

[push_notifications]
# Firebase Cloud Messaging
fcm_enabled=true
fcm_server_key=YOUR_FCM_SERVER_KEY

[api]
# Backend API configuration
api_url=https://api.meengle.app
api_version=v1
timeout=30000

[social]
# Social login
google_auth_enabled=true
apple_auth_enabled=true
facebook_auth_enabled=true

[payments]
# Payment gateway
stripe_enabled=true
stripe_publishable_key=YOUR_STRIPE_PUBLISHABLE_KEY
stripe_secret_key=YOUR_STRIPE_SECRET_KEY

[storage]
# Cloud storage
firebase_storage_enabled=true
aws_s3_enabled=false

[database]
# Database configuration
firebase_realtime_db_enabled=true
firebase_firestore_enabled=true

# Generated configuration (do not edit manually)
[generated]
build_timestamp=$(date)
flutter_version=$(flutter --version | head -1)
build_host=$(hostname)
build_user=$(whoami)
