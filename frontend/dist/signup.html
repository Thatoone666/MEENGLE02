<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - MEENGLE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 36px;
      color: #667eea;
      margin-bottom: 5px;
    }

    .logo p {
      color: #999;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .error {
      background: #fff5f5;
      border: 1px solid #ffcccc;
      color: #cc0000;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    .success {
      background: #f0fff4;
      border: 1px solid #ccffcc;
      color: #00cc00;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      font-size: 13px;
    }

    .success.show {
      display: block;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-group label {
      margin: 0;
      cursor: pointer;
      font-size: 13px;
      color: #666;
    }

    .checkbox-group a {
      color: #667eea;
      text-decoration: none;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-signup:hover {
      transform: scale(1.02);
    }

    .btn-signup:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .legal-footer {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    .legal-footer a {
      color: #667eea;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .signup-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">
      <h1>?? MEENGLE</h1>
      <p>Meet Your Match in South Africa</p>
    </div>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form onsubmit="handleSignup(event)">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input 
            type="text" 
            id="firstName" 
            required 
            placeholder="John"
            autocomplete="given-name"
          >
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input 
            type="text" 
            id="lastName" 
            required 
            placeholder="Doe"
            autocomplete="family-name"
          >
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="your@email.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input 
          type="date" 
          id="dob" 
          required
          autocomplete="bday"
        >
        <small style="color: #999; font-size: 12px;">You must be at least 18 years old</small>
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select id="gender" required>
          <option value="">Select gender...</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="non-binary">Non-binary</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
      </div>

      <div class="form-group">
        <label>City/Area</label>
        <input 
          type="text" 
          id="location" 
          required 
          placeholder="e.g., Johannesburg, Cape Town"
          autocomplete="address-level2"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••"
          minlength="8"
          autocomplete="new-password"
        >
        <small style="color: #999; font-size: 12px;">At least 8 characters</small>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          required 
          placeholder="••••••••"
          minlength="8"
          autocomplete="new-password"
        >
      </div>

      <div class="checkbox-group">
        <input 
          type="checkbox" 
          id="agreeTerms" 
          required
        >
        <label for="agreeTerms">
          I agree to the <a href="/pages/terms.html" target="_blank">Terms of Service</a>,
          <a href="/pages/privacy.html" target="_blank">Privacy Policy</a>, and
          <a href="/pages/community-guidelines.html" target="_blank">Community Guidelines</a>
        </label>
      </div>

      <div class="checkbox-group">
        <input 
          type="checkbox" 
          id="agreeMarketing"
        >
        <label for="agreeMarketing">
          Send me updates about MEENGLE (optional)
        </label>
      </div>

      <button type="submit" class="btn-signup" id="signupBtn">
        <span id="btnText">Create Account</span>
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/pages/login.html">Log in here</a>
    </div>

    <div class="legal-footer">
      <p>???? POPIA Compliant | CPA Protected | South Africa</p>
      <p style="margin-top: 8px;">Safety is our priority. All profiles are verified.</p>
    </div>
  </div>

  <script src="/assets/js/api-client.js"></script>
  <script>
    async function handleSignup(event) {
      event.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const dob = document.getElementById('dob').value;
      const gender = document.getElementById('gender').value;
      const location = document.getElementById('location').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      
      const signupBtn = document.getElementById('signupBtn');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      try {
        // Clear messages
        errorMsg.classList.remove('show');
        successMsg.classList.remove('show');

        // Validation
        if (!firstName || !lastName) {
          throw new Error('Please enter your full name');
        }

        if (password !== confirmPassword) {
          throw new Error('Passwords do not match');
        }

        if (password.length < 8) {
          throw new Error('Password must be at least 8 characters');
        }

        if (!agreeTerms) {
          throw new Error('You must agree to the Terms of Service');
        }

        // Check age (must be 18+)
        const birthDate = new Date(dob);
        const today = new Date();
        const age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        
        if (age < 18 || (age === 18 && monthDiff < 0)) {
          throw new Error('You must be at least 18 years old');
        }

        signupBtn.disabled = true;
        btnText.textContent = 'Creating account...';

        // Call API
        const response = await window.apiClient.signup(email, password, `${firstName} ${lastName}`);

        // Store user data
        if (response.token) {
          localStorage.setItem('authToken', response.token);
          window.apiClient.setToken(response.token);
        }

        successMsg.textContent = 'Account created! Redirecting to profile setup...';
        successMsg.classList.add('show');

        // Redirect to profile creation after 2 seconds
        setTimeout(() => {
          window.location.href = '/pages/create-profile.html';
        }, 2000);

      } catch (error) {
        console.error('Signup failed:', error);
        errorMsg.textContent = error.message || 'Signup failed. Please try again.';
        errorMsg.classList.add('show');
        signupBtn.disabled = false;
        btnText.textContent = 'Create Account';
      }
    }

    // Allow Enter to submit
    document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSignup(e);
    });

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('authToken')) {
        window.location.href = '/pages/dashboard.html';
      }
    });
  </script>
</body>
</html>
