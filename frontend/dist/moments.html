<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments - Meengle</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body {
      background: #f5f5f5;
    }

    .moments-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .moments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .moments-header h1 {
      margin: 0;
    }

    .moments-actions {
      display: flex;
      gap: 10px;
    }

    .moments-actions button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-upload {
      background: #667eea;
      color: white;
    }

    .btn-upload:hover {
      background: #5568d3;
    }

    /* Tabs */
    .moments-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }

    .tab-btn {
      padding: 15px 0;
      border: none;
      background: none;
      cursor: pointer;
      font-weight: 600;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    /* Stories Grid */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .story-card {
      aspect-ratio: 9/16;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 60px;
    }

    .story-card:hover {
      transform: scale(1.05);
    }

    .story-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .story-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      color: white;
      padding: 20px;
    }

    .story-name {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .story-time {
      font-size: 12px;
      opacity: 0.8;
    }

    .story-add {
      aspect-ratio: 9/16;
      border-radius: 12px;
      border: 2px dashed #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .story-add:hover {
      border-color: #667eea;
      background: #f9f9f9;
    }

    .story-add-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .story-add-text {
      font-weight: 600;
      color: #666;
    }

    /* Feed */
    .moments-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .moment-post {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .post-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
    }

    .post-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
    }

    .post-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .post-name {
      font-weight: 600;
      color: #333;
    }

    .post-time {
      font-size: 12px;
      color: #999;
    }

    .post-more {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .post-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .post-actions {
      padding: 15px 20px;
      display: flex;
      gap: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .post-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #666;
      font-weight: 500;
      transition: color 0.3s;
    }

    .post-action-btn:hover {
      color: #667eea;
    }

    .post-stats {
      padding: 10px 20px;
      font-size: 13px;
      color: #666;
      border-bottom: 1px solid #f0f0f0;
    }

    .post-caption {
      padding: 15px 20px;
      color: #333;
      line-height: 1.5;
    }

    .post-comments {
      padding: 0 20px 15px 20px;
    }

    .comment {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .comment-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e0e0e0;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
      background: #f5f5f5;
      padding: 10px 12px;
      border-radius: 6px;
    }

    .comment-name {
      font-weight: 600;
      font-size: 13px;
      color: #333;
      margin-bottom: 2px;
    }

    .comment-text {
      font-size: 13px;
      color: #666;
    }

    .comment-input {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      border-top: 1px solid #f0f0f0;
    }

    .comment-input input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
    }

    .comment-input button {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .stories-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      }

      .post-image {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="moments-container">
    <!-- Header -->
    <div class="moments-header">
      <h1>?? Moments</h1>
      <div class="moments-actions">
        <button class="btn-upload" onclick="uploadMoment()">+ Upload</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="moments-tabs">
      <button class="tab-btn active" data-tab="stories" onclick="switchTab(this, 'stories')">Stories</button>
      <button class="tab-btn" data-tab="feed" onclick="switchTab(this, 'feed')">Feed</button>
      <button class="tab-btn" data-tab="liked" onclick="switchTab(this, 'liked')">Liked</button>
    </div>

    <!-- STORIES TAB -->
    <div id="stories" class="tab-content">
      <div class="stories-grid" id="stories-grid">
        <!-- Stories will be loaded here -->
      </div>
    </div>

    <!-- FEED TAB -->
    <div id="feed" class="tab-content" style="display: none;">
      <div class="moments-feed" id="moments-feed">
        <!-- Feed posts will be loaded here -->
      </div>
    </div>

    <!-- LIKED TAB -->
    <div id="liked" class="tab-content" style="display: none;">
      <div class="stories-grid" id="liked-grid">
        <!-- Liked moments will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api-client.js"></script>
  <script src="/assets/js/auth-guard.js"></script>

  <script>
    // Tab switching
    function switchTab(btn, tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
      
      btn.classList.add('active');
      document.getElementById(tabName).style.display = 'block';

      if (tabName === 'feed') loadFeed();
      else if (tabName === 'liked') loadLikedMoments();
      else loadStories();
    }

    // Load stories
    async function loadStories() {
      const grid = document.getElementById('stories-grid');
      grid.innerHTML = '';

      // Add upload card
      const addCard = document.createElement('div');
      addCard.className = 'story-add';
      addCard.onclick = uploadMoment;
      addCard.innerHTML = `
        <div class="story-add-icon">?</div>
        <div class="story-add-text">Add Story</div>
      `;
      grid.appendChild(addCard);

      try {
        const stories = await window.apiClient.getStories();
        
        if (!stories || stories.length === 0) {
          if (grid.children.length === 1) {
            grid.innerHTML = `
              <div class="empty-state" style="grid-column: 1/-1;">
                <div class="empty-icon">??</div>
                <h3>No stories yet</h3>
                <p>Be the first to share your story!</p>
              </div>
            `;
          }
          return;
        }

        stories.forEach(story => {
          const card = document.createElement('div');
          card.className = 'story-card';
          card.style.backgroundImage = `url(${story.image})`;
          card.style.backgroundSize = 'cover';
          card.onclick = () => viewStory(story.id);
          card.innerHTML = `
            <div class="story-info">
              <div class="story-name">${story.author}</div>
              <div class="story-time">${formatTime(story.createdAt)}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Failed to load stories:', error);
      }
    }

    // Load feed
    async function loadFeed() {
      const feed = document.getElementById('moments-feed');
      feed.innerHTML = '';

      try {
        const moments = await window.apiClient.getMoments();
        
        if (!moments || moments.length === 0) {
          feed.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">??</div>
              <h3>No moments yet</h3>
              <p>Follow people or upload your first moment!</p>
            </div>
          `;
          return;
        }

        moments.forEach(post => {
          const postEl = document.createElement('div');
          postEl.className = 'moment-post';
          postEl.innerHTML = `
            <div class="post-header">
              <div class="post-author">
                <div class="post-avatar">${post.author.charAt(0)}</div>
                <div class="post-meta">
                  <div class="post-name">${post.author}</div>
                  <div class="post-time">${formatTime(post.createdAt)}</div>
                </div>
              </div>
              <button class="post-more" onclick="moreOptions()">?</button>
            </div>

            ${post.image ? `<img src="${post.image}" class="post-image" alt="Moment">` : ''}

            <div class="post-actions">
              <button class="post-action-btn" onclick="likePost('${post.id}')">
                ?? <span>${post.likes || 0}</span>
              </button>
              <button class="post-action-btn" onclick="commentPost('${post.id}')">
                ?? <span>${post.comments?.length || 0}</span>
              </button>
              <button class="post-action-btn" onclick="sharePost('${post.id}')">
                ?? Share
              </button>
            </div>

            ${post.caption ? `<div class="post-caption">${post.caption}</div>` : ''}

            ${post.comments && post.comments.length > 0 ? `
              <div class="post-comments">
                ${post.comments.slice(0, 2).map(comment => `
                  <div class="comment">
                    <div class="comment-avatar">${comment.author.charAt(0)}</div>
                    <div class="comment-content">
                      <div class="comment-name">${comment.author}</div>
                      <div class="comment-text">${comment.text}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div class="comment-input">
              <input type="text" placeholder="Add a comment..." class="comment-field">
              <button onclick="submitComment(this)">Send</button>
            </div>
          `;
          feed.appendChild(postEl);
        });
      } catch (error) {
        console.error('Failed to load feed:', error);
      }
    }

    // Load liked moments
    async function loadLikedMoments() {
      const grid = document.getElementById('liked-grid');
      grid.innerHTML = '';

      try {
        const liked = await window.apiClient.getLikedMoments();
        
        if (!liked || liked.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
              <div class="empty-icon">??</div>
              <h3>No liked moments</h3>
              <p>Like moments to save them here</p>
            </div>
          `;
          return;
        }

        liked.forEach(moment => {
          const card = document.createElement('div');
          card.className = 'story-card';
          card.style.backgroundImage = `url(${moment.image})`;
          card.style.backgroundSize = 'cover';
          card.innerHTML = `
            <div class="story-info">
              <div class="story-name">${moment.author}</div>
              <div class="story-time">${formatTime(moment.createdAt)}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Failed to load liked moments:', error);
      }
    }

    // Actions
    function uploadMoment() {
      window.Toast?.info('Upload feature coming soon!');
    }

    function viewStory(storyId) {
      console.log('Viewing story:', storyId);
    }

    async function likePost(postId) {
      try {
        await window.apiClient.likeMoment(postId);
        window.Toast?.success('Liked!');
      } catch (error) {
        window.Toast?.error('Failed to like');
      }
    }

    function commentPost(postId) {
      window.Toast?.info('Comment feature coming soon');
    }

    function sharePost(postId) {
      window.Toast?.info('Share feature coming soon');
    }

    function submitComment(btn) {
      const input = btn.parentElement.querySelector('.comment-field');
      if (input.value.trim()) {
        window.Toast?.success('Comment posted!');
        input.value = '';
      }
    }

    function moreOptions() {
      window.Toast?.info('More options coming soon');
    }

    function formatTime(date) {
      const now = new Date();
      const then = new Date(date);
      const diff = now - then;
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (hours < 1) return 'Just now';
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      return then.toLocaleDateString();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.AuthGuard?.isAuthenticated?.()) {
        window.location.href = '/pages/login.html';
      }
      loadStories();
    });
  </script>
</body>
</html>
