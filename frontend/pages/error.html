<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - MEENGLE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .error-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 60px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .error-code {
      font-size: 120px;
      font-weight: bold;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .error-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 15px;
    }

    .error-message {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .error-details {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #666;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.02);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f0f4ff;
    }

    .support-info {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #999;
    }

    .support-info a {
      color: #667eea;
      text-decoration: none;
    }

    .support-info a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .error-container {
        padding: 40px 20px;
      }

      .error-code {
        font-size: 80px;
      }

      .error-icon {
        font-size: 60px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon" id="errorIcon">??</div>
    <div class="error-code" id="errorCode">500</div>
    <h1 id="errorTitle">Something Went Wrong</h1>
    <p class="error-message" id="errorMessage">
      An unexpected error occurred. Our team has been notified and we're working to fix it.
    </p>

    <div id="errorDetails" class="error-details" style="display: none;"></div>

    <div class="button-group">
      <button class="btn btn-primary" onclick="goHome()">Go Home</button>
      <button class="btn btn-secondary" onclick="goBack()">Go Back</button>
    </div>

    <div class="support-info">
      <p>If the problem persists, please contact us at:</p>
      <p><a href="mailto:support@meengle.app">support@meengle.app</a></p>
    </div>
  </div>

  <script>
    // Parse error code from URL
    function getErrorCode() {
      const params = new URLSearchParams(window.location.search);
      return params.get('code') || '500';
    }

    // Parse error details from URL
    function getErrorDetails() {
      const params = new URLSearchParams(window.location.search);
      return params.get('details') || '';
    }

    // Get error message based on code
    function getErrorMessage(code) {
      const messages = {
        '400': 'Bad Request - Something is wrong with your request',
        '401': 'Unauthorized - Please log in again',
        '403': 'Forbidden - You don\'t have permission to access this resource',
        '404': 'Not Found - The page you\'re looking for doesn\'t exist',
        '429': 'Too Many Requests - Please wait a moment and try again',
        '500': 'Server Error - Something went wrong on our end',
        '502': 'Bad Gateway - The service is temporarily unavailable',
        '503': 'Service Unavailable - We\'re performing maintenance',
        '504': 'Gateway Timeout - The request took too long',
      };
      return messages[code] || 'An error occurred';
    }

    // Get error icon based on code
    function getErrorIcon(code) {
      const icons = {
        '400': '??',
        '401': '??',
        '403': '??',
        '404': '??',
        '429': '?',
        '500': '??',
        '502': '??',
        '503': '??',
        '504': '??',
      };
      return icons[code] || '??';
    }

    // Initialize error page
    function init() {
      const code = getErrorCode();
      const details = getErrorDetails();

      document.getElementById('errorCode').textContent = code;
      document.getElementById('errorIcon').textContent = getErrorIcon(code);
      document.getElementById('errorMessage').textContent = getErrorMessage(code);

      if (details) {
        document.getElementById('errorDetails').textContent = decodeURIComponent(details);
        document.getElementById('errorDetails').style.display = 'block';
      }

      // Set page title
      document.title = `Error ${code} - MEENGLE`;

      // Update button text based on code
      if (code === '404') {
        document.getElementById('errorTitle').textContent = 'Page Not Found';
      } else if (code === '401') {
        document.getElementById('errorTitle').textContent = 'Session Expired';
        document.querySelector('.btn-primary').textContent = 'Login';
        document.querySelector('.btn-primary').onclick = () => window.location.href = '/pages/login.html';
      }
    }

    function goHome() {
      // Check if user is logged in
      const token = localStorage.getItem('authToken');
      window.location.href = token ? '/pages/dashboard.html' : '/pages/landing.html';
    }

    function goBack() {
      window.history.back();
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
