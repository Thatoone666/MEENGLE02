<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meengle - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="frontend/assets/css/main.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md content-card" data-aos="fade-up">
        <h2 class="text-3xl font-bold text-center mb-4 gradient-text">Forgot Password</h2>
        <p class="text-center muted mb-6">Enter your email and we'll send a link to reset your password.</p>
        <form id="forgot-password-form" class="space-y-4">
            <div>
                <label for="email" class="block font-medium mb-2">Email</label>
                <input type="email" id="email" name="email" required class="form-input">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full btn btn-primary">Send Reset Link</button>
            </div>
        </form>
        <div id="message" class="text-center mt-4"></div>
        <p class="text-center muted mt-6">Remember your password? <a href="login.html" class="text-pink-500 hover:underline">Log In</a></p>
    </div>
    <script>
        AOS.init();
        document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = '';

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'If an account with that email exists, a reset link has been sent.';
                    messageDiv.className = 'text-green-500';
                } else {
                    messageDiv.textContent = data.message || 'An error occurred.';
                    messageDiv.className = 'text-red-500';
                }
            } catch (error) {
                messageDiv.textContent = 'A network error occurred. Please try again.';
                messageDiv.className = 'text-red-500';
            }
        });
    </script>
</body>
</html>
