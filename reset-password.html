<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meengle - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="frontend/assets/css/main.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md content-card" data-aos="fade-up">
        <h2 class="text-3xl font-bold text-center mb-6 gradient-text">Reset Password</h2>
        <form id="reset-password-form" class="space-y-4">
            <div>
                <label for="password" class="block font-medium mb-2">New Password</label>
                <input type="password" id="password" name="password" required class="form-input">
            </div>
            <div>
                <label for="password-confirm" class="block font-medium mb-2">Confirm New Password</label>
                <input type="password" id="password-confirm" name="password-confirm" required class="form-input">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full btn btn-primary">Reset Password</button>
            </div>
        </form>
        <div id="message" class="text-center mt-4"></div>
    </div>
    <script>
        AOS.init();
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            const messageDiv = document.getElementById('message');
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            messageDiv.textContent = '';

            if (password !== passwordConfirm) {
                messageDiv.textContent = 'Passwords do not match.';
                messageDiv.className = 'text-red-500';
                return;
            }

            if (!token) {
                messageDiv.textContent = 'Invalid or missing reset token.';
                messageDiv.className = 'text-red-500';
                return;
            }

            try {
                const response = await fetch(`/api/reset-password/${token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'Password has been reset successfully. You can now log in.';
                    messageDiv.className = 'text-green-500';
                    setTimeout(() => window.location.href = '/login.html', 3000);
                } else {
                    messageDiv.textContent = data.message || 'An error occurred.';
                    messageDiv.className = 'text-red-500';
                }
            } catch (error) {
                messageDiv.textContent = 'A network error occurred. Please try again.';
                messageDiv.className = 'text-red-500';
            }
        });
    </script>
</body>
</html>
