<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meengle - Home</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="stylesheet" href="frontend/assets/css/premium-style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
        }
        .swipe-card {
            transition: all 0.3s ease;
        }
        .swipe-card:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="text-white">
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-30">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center content-card mt-4">
            <a href="#" class="text-2xl font-bold gradient-text">Coding Mingle</a>
            <div class="flex items-center space-x-5">
                <a href="home.html" class="nav-icon active" title="Home"><i data-feather="home"></i></a>
                <a href="fiesty-meengles.html" class="nav-icon" title="Fiesty Meengles"><i data-feather="zap"></i></a>
                <a href="matches.html" class="nav-icon" title="Matches"><i data-feather="users"></i></a>
                <a href="group-chat.html" class="nav-icon" title="Group Chat"><i data-feather="message-square"></i></a>
                <a href="settings.html" class="nav-icon" title="Settings"><i data-feather="settings"></i></a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-32 pb-10 px-4 md:px-8">
        <div class="max-w-md mx-auto">
            <!-- Profile Card -->
            <div class="content-card-image" data-aos="fade-up">
                <div class="relative">
                    <img src="https://source.unsplash.com/random/800x1000?portrait" alt="Profile" class="w-full h-[60vh] object-cover rounded-t-xl">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-6 rounded-b-xl">
                        <h3 class="font-bold text-3xl">Jessica, 27</h3>
                        <p class="text-gray-300">Lover of art and travel</p>
                    </div>
                </div>
                <div class="p-6">
                    <p class="text-gray-300 mb-6 text-center">"My ideal weekend includes a long hike and a good book."</p>
                    <div class="flex justify-around items-center">
                        <button class="btn-icon bg-white/10 text-red-400 hover:bg-red-400 hover:text-white">
                            <i data-feather="x" class="w-8 h-8"></i>
                        </button>
                        <button class="btn-icon bg-gradient-to-br from-pink-500 to-purple-600 text-white text-4xl w-20 h-20">
                            <i data-feather="heart" class="w-10 h-10"></i>
                        </button>
                        <button class="btn-icon bg-white/10 text-blue-400 hover:bg-blue-400 hover:text-white">
                            <i data-feather="star" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="text-center mt-8">
                <a href="#" class="muted hover:text-pink-500 transition-colors">Load more profiles</a>
            </div>
        </div>
    </main>

    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-in-out',
            once: true
        });
        feather.replace();
    </script>
</body>
</html>
