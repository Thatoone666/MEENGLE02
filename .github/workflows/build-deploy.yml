name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Copy frontend to dist
        run: |
          mkdir -p dist
          cp -r frontend/pages/* dist/ 2>/dev/null || true
          cp -r frontend/assets/* dist/ 2>/dev/null || true
          cp frontend/index.html dist/ 2>/dev/null || true
          cp -r frontend/src dist/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: meengle.app
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Upload artifact for preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: dist/
