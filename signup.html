<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meengle - Sign Up</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="frontend/assets/css/main.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen py-12">
    <div class="w-full max-w-md content-card" data-aos="fade-up" data-aos-duration="800">
        <h2 class="text-3xl font-bold text-center mb-6 gradient-text">Create Your Account</h2>
        <form class="space-y-4">
            <div>
                <label for="name" class="block font-medium mb-2">Name</label>
                <input type="text" id="name" name="name" required class="form-input">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="age" class="block font-medium mb-2">Age</label>
                    <input type="number" id="age" name="age" min="18" max="100" required class="form-input">
                </div>
                <div>
                    <label for="gender" class="block font-medium mb-2">Gender</label>
                    <select id="gender" name="gender" required class="form-input">
                        <option value="">Select...</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div>
                <label for="email" class="block font-medium mb-2">Email</label>
                <input type="email" id="email" name="email" required class="form-input">
            </div>
            <div>
                <label for="password" class="block font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" required class="form-input">
            </div>
            <div>
                <label for="confirm-password" class="block font-medium mb-2">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required class="form-input">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full btn btn-primary">Sign Up</button>
            </div>
        </form>
        <p class="text-center muted mt-6">Already have an account? <a href="login.html" class="text-pink-500 hover:underline">Log In</a></p>
    </div>
    <script src="frontend/assets/js/signup.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
