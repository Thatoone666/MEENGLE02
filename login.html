<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meengle - Login</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="frontend/assets/css/main.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md content-card" data-aos="fade-up" data-aos-duration="800">
        <h2 class="text-3xl font-bold text-center mb-6 gradient-text">Log In to Meengle</h2>
        <form class="space-y-6">
            <div>
                <label for="email" class="block font-medium mb-2">Email</label>
                <input type="email" id="email" name="email" required class="form-input">
            </div>
            <div>
                <label for="password" class="block font-medium mb-2">Password</label>
                <input type="password" id="password" name="password" required class="form-input">
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" class="form-checkbox text-pink-500">
                    <span class="ml-2 muted">Remember me</span>
                </label>
                <a href="/forgot-password.html" class="text-pink-500 hover:underline text-sm">Forgot password?</a>
            </div>
            <button type="submit" class="w-full btn btn-primary">Log In</button>
        </form>
        <p class="text-center muted mt-6">Don't have an account? <a href="/signup.html" class="text-pink-500 hover:underline">Sign Up</a></p>
    </div>
        <script src="frontend/assets/js/login.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
